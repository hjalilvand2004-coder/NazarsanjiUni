<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود استاد | سامانه نظرسنجی دروس</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('serve_admin_static', path='style.css') }}?v={{ APP_VERSION }}">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo" style="background:linear-gradient(135deg,#10b981,#059669);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
            </div>
            <h1 class="login-title">ورود استاد</h1>
            <p class="login-sub">سامانه نظرسنجی دروس {{ SEMESTER_LABEL }}</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for cat, msg in messages %}
                    <div class="alert alert-{{ cat }}">{{ msg }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('instructor_login') }}">
                <div class="form-group">
                    <label class="form-label">نام کاربری</label>
                    <input type="text" name="username" class="form-input" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">رمز عبور</label>
                    <input type="password" name="password" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="background:linear-gradient(135deg,#10b981,#059669);">ورود</button>
            </form>

            <div class="login-back">
                ثبت‌نام نکرده‌اید؟
                <a href="{{ url_for('instructor_register') }}">ثبت‌نام استاد جدید</a>
            </div>
            <div class="login-back" style="margin-top:8px;">
                <a href="{{ url_for('login_choice') }}">→ بازگشت به انتخاب نوع ورود</a>
            </div>
        </div>
    </div>
<div style="text-align:center;padding:12px;font-size:12px;color:var(--text-3);border-top:1px solid var(--glass-border);margin-top:20px;">طراحی و توسعه توسط <a href="https://MahAI.ir" target="_blank" style="color:var(--accent);font-weight:600;">شرکت ماه افزار هوشمند رسا</a></div>
</body>
</html>
