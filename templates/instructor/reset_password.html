<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازنشانی رمز عبور | سامانه نظرسنجی دروس</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('serve_admin_static', path='style.css') }}?v={{ APP_VERSION }}">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo" style="background:linear-gradient(135deg,#10b981,#059669);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
                </svg>
            </div>
            <h1 class="login-title">بازنشانی رمز عبور</h1>
            <p class="login-sub">رمز عبور جدید خود را وارد کنید</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for cat, msg in messages %}
                    <div class="alert alert-{{ cat }}">{{ msg }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('instructor_reset_password', token=token) }}">
                <div class="form-group">
                    <label class="form-label">رمز عبور جدید</label>
                    <input type="password" name="new_password" class="form-input" required autofocus minlength="6" placeholder="حداقل ۶ کاراکتر">
                </div>
                <div class="form-group">
                    <label class="form-label">تأیید رمز عبور جدید</label>
                    <input type="password" name="confirm_password" class="form-input" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" style="background:linear-gradient(135deg,#10b981,#059669);width:100%;">تغییر رمز عبور</button>
                <div style="text-align:center;margin-top:14px;">
                    <a href="{{ url_for('instructor_login') }}" style="font-size:13px;color:var(--accent);">→ بازگشت به ورود</a>
                </div>
            </form>
        </div>
    </div>
<div style="text-align:center;padding:12px;font-size:12px;color:var(--text-3);border-top:1px solid var(--glass-border);margin-top:20px;">طراحی و توسعه توسط <a href="https://MahAI.ir" target="_blank" style="color:var(--accent);font-weight:600;">شرکت ماه افزار هوشمند رسا</a></div>
</body>
</html>
